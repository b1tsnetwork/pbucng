# Baut und veröffentlicht alles aus diesem Repository:
#   - Container-Images in der GitHub Container Registry, im Namensraum dieses Repositorys
#     (ghcr.io/<owner>/<repo>/…, z. B. ghcr.io/b1tsnetwork/pbucng/ucng), amd64 + arm64:
#       phonebook (Telefonbuch), ucng (Kommunikation), ucng-voice (Sprach-Server),
#       ucng-beacon, ucng-bot-music
#   - Programmdateien für Linux, Windows und macOS
#   - Installationspaket telefonbuch-stack-<version>.tar.gz (deploy/stack), Windows-Symbol
#   - SHA256SUMS.txt und GitHub Release (nur bei Tags)
#
#   push auf main   -> :main, :sha-<kurz> und :latest
#   Tag v1.2.3      -> :1.2.3, :1.2, :1 und :latest  + GitHub Release
#   Tag v1.2.3-rc.1 -> nur :1.2.3-rc.1 (kein latest) + GitHub Release als Vorabversion
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # UCNG wird mit allen Speicher-Treibern gebaut (Dateien, SQLite, MySQL).
  UCNG_TAGS: "sqlite mysql"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
      ns: ${{ steps.v.outputs.ns }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe braucht die Tags
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"   # GHCR-Namen klein
          # Eigene Pakete je Repository: ghcr.io/<owner>/<repo>/<image> – entstehen im Kontext dieses
          # Repositorys und sind von gleichnamigen Paketen anderer Repos getrennt.
          echo "ns=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(git describe --tags --always | sed 's/^v//')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          pre=false; [[ "$GITHUB_REF" == refs/tags/v*-* ]] && pre=true
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.image }}
    needs: [ci, meta]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write       # Herkunftsnachweis
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: phonebook,      context: ./phonebook, file: ./phonebook/Dockerfile }
          - { image: ucng,           context: ./ucng,      file: ./ucng/Dockerfile }
          - { image: ucng-voice,     context: ./ucng,      file: ./ucng/Dockerfile.voice }
          - { image: ucng-beacon,    context: ./ucng,      file: ./ucng/Dockerfile.beacon }
          - { image: ucng-bot-music, context: ./ucng,      file: ./ucng/Dockerfile.music }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Kompiliert wird nativ (BUILDPLATFORM); QEMU braucht es nur für RUN-Befehle im arm64-Laufzeit-Image.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Anmelden bei ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tags
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.meta.outputs.ns }}/${{ matrix.image }}
          # Quelle = dieses Repository: GHCR verknüpft das Paket damit (auch beim Mehrplattform-Index)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
          # Vorabversionen (Bindestrich) bekommen weder latest noch 1.2/1 – das regelt semver selbst
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) }}

      - name: Bauen und veröffentlichen
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/ucng
            TAGS=${{ env.UCNG_TAGS }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          annotations: ${{ steps.tags.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: mode=max
          sbom: true

      - name: Herkunftsnachweis (Attestation)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.meta.outputs.ns }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  binaries:
    name: Programme ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [ci, meta]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (Telefonbuch)
        uses: actions/setup-go@v7
        with:
          go-version-file: phonebook/go.mod
          cache-dependency-path: phonebook/go.sum

      - name: Telefonbuch bauen
        shell: bash
        working-directory: phonebook
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          go mod tidy
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          name="telefonbuch_${VERSION}_${GOOS}_${GOARCH}"
          out="$GITHUB_WORKSPACE/dist/$name"
          mkdir -p "$out"
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$out/telefonbuch$ext" .
          cp README.md config.example.json "$out/"
          cp -r migrations "$out/"

      - name: Set up Go (UCNG)
        uses: actions/setup-go@v7
        with:
          go-version-file: ucng/go.mod
          cache-dependency-path: ucng/go.sum

      - name: UCNG bauen
        shell: bash
        working-directory: ucng
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          sh scripts/drivers.sh $UCNG_TAGS
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          name="ucng_${VERSION}_${GOOS}_${GOARCH}"
          out="$GITHUB_WORKSPACE/dist/$name"
          mkdir -p "$out"
          ldflags="-s -w -X main.version=$VERSION -X main.sourceURL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}/ucng"
          go build -tags "$UCNG_TAGS" -trimpath -ldflags="$ldflags" -o "$out/ucng$ext" .
          go build -trimpath -ldflags="$ldflags" -o "$out/ucng-beacon$ext" ./cmd/ucng-beacon
          go build -trimpath -ldflags="$ldflags" -o "$out/ucng-voice$ext" ./cmd/ucng-voice
          cp README.md "$out/"
          cp LICENSE "$out/LICENSE.txt"
          cp web/flags/LICENSE.txt "$out/LICENSE-flags.txt"

      - name: Packen
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for d in */; do
            d="${d%/}"
            if [ "${{ matrix.goos }}" = windows ]; then zip -qr "$d.zip" "$d"; else tar -czf "$d.tar.gz" "$d"; fi
            rm -rf "$d"
          done
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  bundle:
    name: Installationspaket
    needs: [ci, meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stack und Windows-Symbol packen
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          name="telefonbuch-stack-${VERSION}"
          mkdir -p "dist/$name"
          cp -r deploy/stack/. "dist/$name/"
          rm -f "dist/$name/.env" "dist/$name/voice-node/.env"
          sed -i "s/^TB_VERSION=.*/TB_VERSION=${VERSION}/; s/^UCNG_VERSION=.*/UCNG_VERSION=${VERSION}/" "dist/$name/.env.example"
          sed -i "s/^UCNG_VERSION=.*/UCNG_VERSION=${VERSION}/" "dist/$name/voice-node/.env.example"
          cp phonebook/docs/RELEASE-ENTSCHEIDUNGEN.md phonebook/RELEASE-NOTES.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          (cd phonebook/client && zip -qr "$GITHUB_WORKSPACE/dist/telefonbuch-windows-symbol_${VERSION}.zip" windows)
      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [meta, images, binaries, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # nur für das Release bei Tags
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Prüfsummen
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NS: ${{ needs.meta.outputs.ns }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes=/tmp/notes.md
          cp phonebook/RELEASE-NOTES.md "$notes"
          {
            echo
            echo "## Container-Images"
            for i in phonebook ucng ucng-voice ucng-beacon ucng-bot-music; do echo "- \`${NS}/${i}:${VERSION}\`"; done
          } >> "$notes"
          flag=""; [ "$PRE" = true ] && flag="--prerelease"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag $flag --title "Telefonbuch + Kommunikation $TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" --clobber dist/*

      - name: Zusammenfassung
        shell: bash
        env:
          NS: ${{ needs.meta.outputs.ns }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          {
            echo "### Images (${VERSION})"
            for i in phonebook ucng ucng-voice ucng-beacon ucng-bot-music; do echo "- \`${NS}/${i}:${VERSION}\`"; done
            echo
            echo "| Datei | SHA256 |"
            echo "|---|---|"
            while read -r sum file; do echo "| \`$file\` | \`$sum\` |"; done < dist/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
