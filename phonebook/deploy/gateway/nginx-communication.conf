# Beispiel: nginx als HTTPS-Gateway für Telefonbuch + Kommunikation (Subdomain-Betrieb, ADR-004).
# Danach immer prüfen:  telefonbuch commcheck -phonebook https://telefonbuch.firma.local \
#                         -communication https://kommunikation.firma.local [-ucng-admin-password-file …]
# (Diese Datei ist eine Vorlage; automatisiert getestet wurde die Routing-Logik mit tools/devgateway.)

# im http-Block:
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    http2 on;
    server_name telefonbuch.firma.local;
    ssl_certificate     /etc/ssl/firma/telefonbuch.crt;
    ssl_certificate_key /etc/ssl/firma/telefonbuch.key;

    # Server-zu-Server-Schnittstelle der Kommunikation (PH-02): nur intern. UCNG ruft das
    # Telefonbuch direkt im Docker-Netz auf (http://app:8080), nicht über diesen Gateway.
    location /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;            # manueller AD-Abgleich
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kommunikation.firma.local;
    ssl_certificate     /etc/ssl/firma/kommunikation.crt;
    ssl_certificate_key /etc/ssl/firma/kommunikation.key;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # ersetzen statt anhängen (UCNG liest von rechts)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;              # Live-Verbindungen (Server-Sent Events)
        proxy_read_timeout 1h;
        client_max_body_size 10m;         # Bild-Uploads (bis 8 MB)
        proxy_set_header Upgrade $http_upgrade;          # Sprachkanäle (WebSocket)
        proxy_set_header Connection $connection_upgrade;
    }
}
